name: inbox-chief
repo: https://github.com/andrewjsoukup/hermes-inbox-chief
sha: 44160006ddcb29e3e71747cda2e760ceb01a0906
subdir: ""
title: Inbox Chief
description: 'Outlook (personal Outlook.com or Microsoft 365) inbox chief of staff: routes each email to one owner lane, catches customer replies on threads you started, supplier replies, replies owed and overdue follow-ups, links a supplier''s answer to the customer thread waiting on it, stages reply-all drafts and sends only after your explicit go (never from cron). Desktop pane with Go / Change / Skip. Microsoft Graph via a Hermes-held oauth: grant on your own Entra app.'
maintainer: andrewjsoukup
tier: community
category: tools
requires_hermes: ">=0.22.3"
docs_url: https://github.com/andrewjsoukup/hermes-inbox-chief#readme
version: "0.1.0"
screenshots:
  - https://raw.githubusercontent.com/andrewjsoukup/hermes-inbox-chief/44160006ddcb29e3e71747cda2e760ceb01a0906/docs/screenshots/panel-queue.png
  - https://raw.githubusercontent.com/andrewjsoukup/hermes-inbox-chief/44160006ddcb29e3e71747cda2e760ceb01a0906/docs/screenshots/panel-confirm.png
  - https://raw.githubusercontent.com/andrewjsoukup/hermes-inbox-chief/44160006ddcb29e3e71747cda2e760ceb01a0906/docs/screenshots/panel-preview.png
  - https://raw.githubusercontent.com/andrewjsoukup/hermes-inbox-chief/44160006ddcb29e3e71747cda2e760ceb01a0906/docs/screenshots/panel-notes.png
readme: true
platforms: []
known_issues:
  - Microsoft sign-in is configured for personal Outlook.com and Microsoft 365 work/school mailboxes; an Entra app registration supporting both audiences is still required (README → Microsoft sign-in).
  - First live sign-in is pending. Current Hermes scope-echo validation may reject Microsoft grants; the random loopback callback may need exact-port registration. See docs/DEMO_MAILBOX_SETUP.md.
capabilities:
  provides_tools:
    - inbox_chief_status
    - inbox_chief_scan
    - inbox_chief_thread
    - inbox_chief_draft_reply
    - inbox_chief_draft_new
    - inbox_chief_pending
    - inbox_chief_send
    - inbox_chief_resolve
    - inbox_chief_notes
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - INBOX_CHIEF_MS_CLIENT_ID
